name: Binance Alpha + Web3 Validator

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

# ایک وقت میں صرف ایک run چلے گا
concurrency:
  group: binance-alpha-web3-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # Checkout
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==============================
      # Python
      # ==============================
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ==============================
      # Requests
      # ==============================
      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==============================
      # Binance Alpha Monitor
      # ==============================
      - name: Run Binance Alpha Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python alpha_alert.py

      # ==============================
      # Binance Web3 Monitor
      # ==============================
      - name: Run Binance Web3 Wallet Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python wallet_token_alert.py

      # ==============================
      # Save token databases
      # ==============================
      - name: Save token state
        run: |

          git config user.name "Binance Web3 Monitor"
          git config user.email "binance-web3-monitor@users.noreply.github.com"

          git add alpha_tokens.json wallet_tokens.json

          if git diff --cached --quiet; then
            echo "No token state changes to commit."
            exit 0
          fi

          git commit -m "Update Binance token states"

          # تازہ ترین main حاصل کریں
          git fetch origin main

          # اگر remote میں نئی تبدیلی ہو تو پہلے اسے شامل کریں
          git merge --no-edit origin/main || {
            echo "Merge conflict detected."
            echo "Aborting this state update to avoid corrupting token databases."
            git merge --abort || true
            exit 0
          }

          # تازہ ترین state محفوظ کریں
          git push origin main
