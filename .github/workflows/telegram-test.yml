name: Binance Alpha + Wallet Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      # =========================
      # BINANCE ALPHA MONITOR
      # =========================

      - name: Run Binance Alpha Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python alpha_alert.py

      # =========================
      # BINANCE WALLET / WEB3
      # MONITOR
      # =========================

      - name: Run Binance Wallet Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python wallet_token_alert.py

      # =========================
      # SAVE DATABASES
      # =========================

      - name: Save token states
        run: |
          git config user.name "Binance Web3 Monitor"
          git config user.email "binance-web3-bot@users.noreply.github.com"

          git add alpha_tokens.json wallet_tokens.json

          git diff --cached --quiet || git commit -m "Update Binance token states"

          git push
